name: List Installed Fonts on Ubuntu Runners

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行
  push:
    branches: [ develop ]

jobs:
  list-fonts:
    name: Fonts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Check fontconfig & list fonts in console
        run: |
          echo "=== 系统版本 ==="
          lsb_release -a

          echo -e "\n=== 1. 已安装的字体家族 (Font Families) ==="
          fc-list : family | tr ',' '\n' | sed 's/^[ \t]*//' | sort -u

          echo -e "\n=== 2. 支持中文 (zh) 的字体 ==="
          ZH_FONTS=$(fc-list :lang=zh family)
          if [ -z "$ZH_FONTS" ]; then
            echo "未检测到任何预装中文字体"
          else
            echo "$ZH_FONTS" | tr ',' '\n' | sed 's/^[ \t]*//' | sort -u
          fi

          echo -e "\n=== 3. 已安装的 apt 字体包 ==="
          dpkg -l | grep -E "^ii\s+fonts-" | awk '{print $2, $3}'

          echo -e "\n=== 4. 默认字体匹配测试 (Sans / Serif / Monospace) ==="
          for generic in sans-serif serif monospace; do
            echo -n "$generic -> "
            fc-match "$generic"
          done

      - name: Generate Job Summary (写入可视化摘要面板)
        run: |
          {
            echo "## 🖥️ ${{ matrix.os }} 预装字体报告"
            echo ""
            echo "**系统详细版本:** \`$(lsb_release -ds)\` | **字体文件总数:** \`$(fc-list | wc -l)\`"
            echo ""
            echo "### 1. 默认字体回退 (Font Fallback)"
            echo "| 通用族 (Generic) | 默认匹配字体 (Matched Font) |"
            echo "| :--- | :--- |"
            echo "| \`sans-serif\` | \`$(fc-match sans-serif)\` |"
            echo "| \`serif\` | \`$(fc-match serif)\` |"
            echo "| \`monospace\` | \`$(fc-match monospace)\` |"
            echo "| \`sans-serif:lang=zh-cn\` | \`$(fc-match 'sans-serif:lang=zh-cn')\` |"
            echo ""
            echo "<details><summary><b>📦 点击展开：已安装的 APT 字体软件包</b></summary>"
            echo ""
            echo "\`\`\`text"
            dpkg -l | grep -E "^ii\s+fonts-" | awk '{printf "%-35s %s\n", $2, $3}'
            echo "\`\`\`"
            echo "</details>"
            echo ""
            echo "<details><summary><b>🔤 点击展开：所有去重后的字体家族名称 (Font Families)</b></summary>"
            echo ""
            echo "\`\`\`text"
            fc-list : family | tr ',' '\n' | sed 's/^[ \t]*//' | sort -u
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
